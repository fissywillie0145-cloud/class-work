<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise-Based Order Processing</title>
</head>
<body>
        <button onclick="processOrder()">Place Order</button>

    <div id="result"></div>

 <script>
    // Simulate an API call to place an order
    function placeOrder(orderDetails) {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                if (orderDetails && orderDetails.items && orderDetails.items.length > 0) {
                    resolve({ success: true, message: "Order placed successfully!" });
                } else {
                    reject(new Error("Invalid order details."));
                }
            }, 1000);
        });
    }

    // Function to process the order
    async function processOrder() {
        const orderDetails = {
            items: [
                { name: "Product 1", quantity: 2, price: 10.99 },
                { name: "Product 2", quantity: 1, price: 29.99 }
            ]
        };

        const resultDiv = document.getElementById("result");

        try {
            const result = await placeOrder(orderDetails);
            resultDiv.innerHTML = `<p>${result.message}</p>`;
        } catch (error) {
            resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
        }
    }
 </script>
</body>
</html>
