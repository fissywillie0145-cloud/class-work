<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Handling and Input Validation</title>
</head>
<body>
    <form onsubmit="registerUser(event)">

        <label>Full Name:</label><br>
        <input type="text" id="fullName" placeholder="Enter your full name">
        <br><br>

        <label>Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email">
        <br><br>

        <label>Age:</label><br>
        <input type="number" id="age" placeholder="Enter your age">
        <br><br>

        <label>Password:</label><br>
        <input type="password" id="password" placeholder="Enter your password">
        <br><br>

        <button type="submit">Register</button>

    </form>                         

    <div id="result"></div>



 <script>

  const users = [];
  function registerUser(event) {
        event.preventDefault(); // Prevent form submission

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const age = parseInt(document.getElementById("age").value);
        const password = document.getElementById("password").value;

        const resultDiv = document.getElementById("result");

        // Input validation
        if (!fullName || !email || isNaN(age) || !password) {
            resultDiv.innerHTML = "Please fill in all fields.";
            return;
        }

        if (age < 18) {
            resultDiv.innerHTML = "You must be at least 18 years old to register.";
            return;
        }

        if (password.length < 8) {
            resultDiv.innerHTML = "Password must be at least 8 characters long.";
            return;
        }

        // Store user data
        users.push({ fullName, email, age, password });
        resultDiv.innerHTML = "Registration successful!";
    }



 </script>


</body>
</html>
